const COMPLEMENT = {A:"T",T:"A",C:"G",G:"C"};

function reverseComplement(dna) {
    let rc = "";
    for (let i = dna.length - 1; i >= 0; i--) {
        rc += COMPLEMENT[dna[i]] || dna[i];
    }
    return rc;
}

function analyze(seq) {
    const results = [];
    for (let i = 0; i <= seq.length - 4; i++) {
        const kmer = seq.substring(i, i + 4);
        const rc = reverseComplement(kmer);
        const countDirect = ls.filter(x => x === kmer).length;
        const countRC = ls.filter(x => x === rc).length;
        const count = Math.max(countDirect, countRC);
        results.push({ kmer, count });
    }
    return results;
}

function doAnalyze() {
    const input = document.getElementById("seqInput").value.trim().toUpperCase();
    if (!input) { alert("请输入DNA序列"); return; }
    if (!/^[ATCG]+$/i.test(input)) { alert("序列只能包含 A、T、C、G"); return; }

    document.getElementById("analyzeBtn").disabled = true;
    document.getElementById("analyzeBtn").textContent = "分析中...";

    setTimeout(() => {
        const results = analyze(input);

        const statsArea = document.getElementById("statsArea");

            '<div class="stat"><b>' + totalKmers + '</b><span>4-mer 总数</span></div>' +

            '<div class="stat"><b>' + ls.length + '</b><span>数据库大小</span></div>';

            html += "</tbody></table>";
