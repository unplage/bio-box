# Example: STEAP1 soluble redesign using 8UCD template (chains A/B/C trimer).
# Reference numbering == UniProt Q9UHE8 numbering (1..339).
# A fully annotated STEAP1 config lives in `config.steap1.yaml`.
# Run: python -m tmkit.pipeline --config config.example.yaml \
#        --pdb pdb/8UCD.pdb --steps mask,design,native,predict,stability,report

name: steap1_8ucd
chains: [A, B, C]
membrane_class: alpha_helical_multi

# Full-length STEAP1 sequence (UniProt Q9UHE8); positions are UniProt numbers.
reference_sequences:
  A: ""
  B: ""
  C: ""

# Six TM helices (UniProt numbering): h1..h6.
tm_segments:
  - [71, 91]
  - [119, 139]
  - [164, 184]
  - [218, 238]
  - [258, 278]
  - [291, 311]

# ECD = EC1(92-118) + EC2(185-217) + EC3(279-290) -- kept 100% fixed.
ecd_segments:
  - [92, 118]
  - [185, 217]
  - [279, 290]

# Intracellular loops kept native.
icd_segments:
  - [140, 163]
  - [239, 257]

# Only TMD surface is redesigned.
design_scope: tm_surface

# Heme pocket coordination: H175/H268 and +/-2 neighbors never redesigned.
fixed_residues: [175, 268]
protect_pad: 2

# ECD-TM junction protection (most fragile region).
tm_junction_keep: 2

# SASA filter: only TM positions exposed (SASA > 40 A^2) are redesigned.
surface_sasa_threshold: 40.0

# Protect the oligomer interface; symmetric designable mask.
# Defaults are derived automatically: same sequence across chains => symmetric;
# single-chain (monomer) targets skip interface/symmetry gates entirely.
interface_mode: fixed
interface_contact_dist: 6.0
symmetric_mask: true
# Topology. STEAP1: N/C termini intracellular, first inter-TM loop (EC1) = ECD.
# For a type-I GPCR (large extracellular N-terminus) use:
#   first_loop: ICD
#   nterm: ECD
#   cterm: ICD
first_loop: ECD                # ECD | ICD (side of the TM1-TM2 loop)
disulfides: auto
ptms: false
assembly: as_is
strict_predict: true
# nterm: ECD
# cterm: ICD

# --- Membrane slab (optional) ---
# Restrict designable positions to the lipid-facing slab. Without this block
# the mask uses SASA alone. Three ways to define the plane:
#   (a) explicit normal/center (center defaults to TM C-alpha mean projection):
# membrane: {normal: [0, 0, 1], thickness: 30.0, headgroup: 15.0}
#   (b) derive the normal by PCA of TM C-alphas:
# membrane: {normal: auto, thickness: 30.0, headgroup: 15.0}
#   (c) an OPM/PPM transformed structure (membrane plane z=0):
# membrane_opm_pdb: /path/to/opm_transformed.pdb
# If `exclude_aromatic_belt: true` (default), interfacial Trp/Phe/Tyr in the
# headgroup zone stay native; `restrict_to_core: true` forbids headgroup design.

# Evaluation gates. A design passes only if every gate holds.
# Assembly/interface gates (iptm, chain_symmetry_rmsd, interface_mut,
# interface_recovery) are dropped automatically for single-chain targets.
filters:
  tm_score:      ['>=', 0.800]
  plddt:         ['>=', 80.0]
  plddt_ecd:     ['>=', 75.0]
  ecd_rmsd:      ['<=', 1.0]
  surf_hydro_tm: ['<=', 0.35]    # exposed hydrophobicity over the whole TMD
  surf_hydro_des: ['<=', 0.30]   # hydrophobicity on the redesigned surface
  pocket_rmsd:   ['<=', 2.0]
  iptm:          ['>=', 0.80]    # oligomer assembly confidence (multi-chain)
  chain_symmetry_rmsd: ['<=', 2.0]
  interface_recovery: ['>=', 0.80]  # template interface contacts kept (multi-chain)
  exposed_arom:  ['<=', 3]
  cys_des:       ['==', 0]
  mutations:     ['<=', 120]
  soluble_score: ['>=', 0.60]
  residual_hydro: ['<=', 0.35]
  interface_mut: ['==', 0]
  max_hydro_window: ['<=', 0.60]  # largest hydrophobic patch among designed positions

# Pocket residues for the pocket_rmsd gate (reference numbering).
pocket_residues: [175, 268]
pocket_shell_dist: 8.0         # grow pocket set with template neighbours
interface_recovery_dist: 8.0   # C-alpha cutoff for interface contact recovery

# --- ProteinMPNN (dir containing protein_mpnn_run.py) ---
proteinmpnn_dir: /opt/proteinmpnn
soluble_model: true            # use soluble model weights (Goverde 2024)
num_seqs: 32                   # production: >=100 recommended
temperature: "0.15 0.2"

# Sampling sweeps: each scalar or list expands into one run per combination
# (model_name x backbone_noise x seeds). Each run writes its own FASTA so
# designs never overwrite each other. Defaults: one run with no overrides.
# model_name: [v_48_020, v_48_030]
# backbone_noise: [0.0, 0.02, 0.1]
# seeds: [0, 1, 2]

# --- Structure prediction for validation ---
# External predictors (boltz, af3, chai, external) are run by the user and
# read back via --results-dir (PDB or mmCIF). Locally: colabfold | alphafold.
predict_tool: colabfold        # colabfold | alphafold | boltz | af3 | external | none
colabfold_model: alpha2_multimer_v3
num_recycles: 3
colabfold_amber: true
predict_native: true           # also predict the native seq as gate baseline
results_dir: ""                # set via --results-dir for external models
# Optional custom filename patterns (defaults cover ColabFold/AlphaFold/
# Boltz/AF3). `{name}` is the design name.
# results_globs: ['{name}*rank_001*.pdb', '{name}*_model_0.cif']

output: outputs
workdir: /tmp/opencode
