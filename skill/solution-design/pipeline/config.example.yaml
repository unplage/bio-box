# Example: STEAP1 soluble redesign using 8UCD template (chains A/B/C trimer).
# Reference numbering == UniProt Q9UHE8 numbering (1..339).
# A fully annotated STEAP1 config lives in `config.steap1.yaml`.
# Run: python -m tmkit.pipeline --config config.example.yaml \
#        --pdb pdb/8UCD.pdb --steps mask,design,native,predict,stability,report

name: steap1_8ucd
chains: [A, B, C]

# Full-length STEAP1 sequence (UniProt Q9UHE8); positions are UniProt numbers.
reference_sequences:
  A: ""
  B: ""
  C: ""

# Six TM helices (UniProt numbering): h1..h6.
tm_segments:
  - [71, 91]
  - [119, 139]
  - [164, 184]
  - [218, 238]
  - [258, 278]
  - [291, 311]

# ECD = EC1(92-118) + EC2(185-217) + EC3(279-290) -- kept 100% fixed.
ecd_segments:
  - [92, 118]
  - [185, 217]
  - [279, 290]

# Intracellular loops kept native.
icd_segments:
  - [140, 163]
  - [239, 257]

# Only TMD surface is redesigned.
include: designable

# Heme pocket coordination: H175/H268 and +/-2 neighbors never redesigned.
fixed_residues: [175, 268]
protect_pad: 2

# ECD-TM junction protection (most fragile region).
tm_junction_keep: 2

# SASA filter: only TM positions exposed (SASA > 40 A^2) are redesigned.
surface_sasa_threshold: 40.0
design_tm_surface_only: true

# Protect the C3 trimer interface; symmetric designable mask (homotrimer).
fix_interface_contacts: true
interface_contact_dist: 6.0
symmetric_mask: true

# Evaluation gates. A design passes only if every gate holds.
filters:
  tm_score:      ['>=', 0.800]
  plddt:         ['>=', 80.0]
  plddt_ecd:     ['>=', 75.0]
  ecd_rmsd:      ['<=', 1.0]
  surf_hydro_des: ['<=', 0.30]   # hydrophobicity on the redesigned surface
  pocket_rmsd:   ['<=', 2.0]
  exposed_arom:  ['<=', 3]
  cys_des:       ['==', 0]
  mutations:     ['<=', 120]
  soluble_score: ['>=', 0.60]
  residual_hydro: ['<=', 0.35]
  interface_mut: ['==', 0]

# Pocket residues for the pocket_rmsd gate (UniProt numbering).
pocket_residues: [175, 268]

# --- ProteinMPNN (dir containing protein_mpnn_run.py) ---
proteinmpnn_dir: /opt/proteinmpnn
soluble_model: true            # use soluble model weights (Goverde 2024)
num_seqs: 32                   # production: >=100 recommended
temperature: "0.15 0.2"

# --- Structure prediction for validation ---
predict_tool: colabfold        # colabfold | alphafold | none
colabfold_model: alpha2_multimer_v3
num_recycles: 3
colabfold_amber: true
predict_native: true           # also predict the native seq as gate baseline
results_dir: ""

output: outputs
workdir: /tmp/opencode
