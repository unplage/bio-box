# Example: 8UCD (Cx3CL1/fractalkine TM construct, chains A/B/C trimer).
# UCD positional numbering = 1..N per chain, where N = harmonized chain length.

name: 8UCD
chains: [A, B, C]

# Full-length reference sequences, one per chain (shared for homotrimer).
# Positional numbers are 1-based indexes into these sequences.
reference_sequences:
  A: "LFPQWHLPIKIAAIIASLTFLYTLLREVIHPLATSHQQYFYKIPILVINKVLPMVSITLLALVYLPGVIAAIVQLFPHWLDKWMLTRKQFGLLSFFFAVLHAIYSLSYPMRRSYRYKLLNWAYQQVQQNKEDAWIEHDVWRMEIYVSLGIVGLAILALLAVTSIPSVSDSLTWREFHYIQSKLGIVSLLLGTIHALIFAWNKWIDIKQFVWYTPPTFMIAVFLPIVVLIFKSILFL"
  B: "LFPQWHLPIKIAAIIASLTFLYTLLREVIHPLATSHQQYFYKIPILVINKVLPMVSITLLALVYLPGVIAAIVQLFPHWLDKWMLTRKQFGLLSFFFAVLHAIYSLSYPMRRSYRYKLLNWAYQQVQQNKEDAWIEHDVWRMEIYVSLGIVGLAILALLAVTSIPSVSDSLTWREFHYIQSKLGIVSLLLGTIHALIFAWNKWIDIKQFVWYTPPTFMIAVFLPIVVLIFKSILFL"
  C: "LFPQWHLPIKIAAIIASLTFLYTLLREVIHPLATSHQQYFYKIPILVINKVLPMVSITLLALVYLPGVIAAIVQLFPHWLDKWMLTRKQFGLLSFFFAVLHAIYSLSYPMRRSYRYKLLNWAYQQVQQNKEDAWIEHDVWRMEIYVSLGIVGLAILALLAVTSIPSVSDSLTWREFHYIQSKLGIVSLLLGTIHALIFAWNKWIDIKQFVWYTPPTFMIAVFLPIVVLIFKSILFL"

# TM region boundaries (reference positions). ECD = soluble/extracellular part.
tm_segments:
  - [43, 77]
ecd_segments:
  - [78, 236]

# Which regions may be mutated. designable = TMD only (keep ECD/TM surfaces):
include: designable

# Residues +-3 around these are never mutated (e.g. functional/interface).
# fixed_residues: []
# protect_pad: 3
# Keep the 2 junction residues on each TM end untouched:
tm_junction_keep: 2

# SASA filter: only solvent-exposed TM positions (SASA > 40 A^2) are redesigned.
surface_sasa_threshold: 40.0
design_tm_surface_only: true

# Hard-fix residues that contact another chain (oligomer interface): protects
# the trimer assembly / interaction surfaces from destabilizing mutations.
fix_interface_contacts: true
interface_contact_dist: 6.0
# For homooligomers: force the designable mask identical across chains so the
# assembled chains stay sequence-identical.
symmetric_mask: true

# Evaluation gates. A design passes only if every gate holds.
filters:
  tm_score: ['>=', 0.800]
  plddt:    ['>=', 80.0]
  ecd_rmsd: ['<=', 1.0]
  surf_hydro: ['<=', 0.30]
  mutations: ['<=', 30]
  # stability-derived gates (step: stability)
  soluble_score: ['>=', 0.60]     # clamped solubility propensity over redesigned TMD
  residual_hydro: ['<=', 0.35]    # fraction of redesigned positions left hydrophobic
  interface_mut: ['==', 0]        # no mutation at inter-chain contact residues

# --- ProteinMPNN (set dir containing protein_mpnn_run.py) ---
proteinmpnn_dir: /opt/proteinmpnn
soluble_model: true            # use soluble model weights (optimal for soluble redesign)
num_seqs: 8
temperature: "0.15 0.2"

# --- Structure prediction for validation ---
# predict_tool: colabfold (alpha2_multimer_v3) | alphafold | none
predict_tool: colabfold
colabfold_model: alpha2_multimer_v3
num_recycles: 3
# Path to a folder with *rank_001_*.pdb models already computed externally;
# empty string means the pipeline runs the prediction command itself.
results_dir: ""

output: outputs
workdir: /tmp/opencode